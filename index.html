<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión | COPACI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-body">

    <div class="login-box">

        <h1>COPACI</h1>

        <h2>Sistema de Gestión Ciudadana</h2>

        <p>
            Nicolás Romero, Estado de México
        </p>


        <!-- ============================= -->
        <!-- INICIO DE SESIÓN -->
        <!-- ============================= -->

        <form id="loginForm">

            <label for="usuario">
                Usuario
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Ingresa tu usuario"
                required
            >


            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Ingresa tu contraseña"
                required
            >


            <label for="tipo">
                Tipo de usuario
            </label>

            <select id="tipo" required>

                <option value="">
                    Selecciona una opción
                </option>

                <option value="ciudadano">
                    Ciudadano
                </option>

                <option value="copaci">
                    Miembro del COPACI
                </option>

                <option value="admin">
                    Administrador
                </option>

            </select>


            <button type="submit">
                Iniciar sesión
            </button>

        </form>


        <p id="mensaje"></p>


        <!-- ============================= -->
        <!-- CREAR CUENTA -->
        <!-- ============================= -->

        <div id="opcionRegistro">

            <p>
                ¿No tienes una cuenta?
            </p>

            <button
                type="button"
                class="boton"
                onclick="mostrarRegistro()"
            >
                Crear cuenta
            </button>

        </div>


        <!-- ============================= -->
        <!-- REGISTRO -->
        <!-- ============================= -->

        <div
            id="registro"
            style="display: none;"
        >

            <hr>

            <h3>
                Crear cuenta de ciudadano
            </h3>


            <label for="nombreRegistro">
                Nombre completo
            </label>

            <input
                type="text"
                id="nombreRegistro"
                placeholder="Nombre completo"
            >


            <label for="usuarioRegistro">
                Usuario
            </label>

            <input
                type="text"
                id="usuarioRegistro"
                placeholder="Crea un usuario"
            >


            <label for="correoRegistro">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoRegistro"
                placeholder="correo@ejemplo.com"
            >


            <label for="passwordRegistro">
                Contraseña
            </label>

            <input
                type="password"
                id="passwordRegistro"
                placeholder="Crea una contraseña"
            >


            <button
                type="button"
                class="boton"
                onclick="registrarCiudadano()"
            >
                Registrarme
            </button>


            <button
                type="button"
                class="boton"
                onclick="ocultarRegistro()"
            >
                Regresar
            </button>


            <p id="mensajeRegistro"></p>

        </div>

    </div>


    <script>

        // ========================================
        // OBTENER CIUDADANOS
        // ========================================

        function obtenerCiudadanos() {

            const datos =
                localStorage.getItem("ciudadanos");

            if (!datos) {

                return [];

            }

            try {

                const ciudadanos =
                    JSON.parse(datos);

                if (Array.isArray(ciudadanos)) {

                    return ciudadanos;

                }

                return [];

            } catch (error) {

                return [];

            }

        }


        // ========================================
        // INICIO DE SESIÓN
        // ========================================

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const usuario =
                    document
                        .getElementById("usuario")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const tipo =
                    document
                        .getElementById("tipo")
                        .value;


                const mensaje =
                    document
                        .getElementById("mensaje");


                mensaje.textContent = "";


                // ====================================
                // ADMINISTRADOR
                // ====================================

                if (
                    tipo === "admin" &&
                    usuario === "admin" &&
                    password === "Admin2026"
                ) {

                    localStorage.setItem(
                        "tipoUsuario",
                        "admin"
                    );

                    localStorage.setItem(
                        "usuarioActual",
                        "admin"
                    );

                    window.location.href =
                        "admin.html";

                    return;

                }


                // ====================================
                // MIEMBRO DEL COPACI
                // ====================================

                if (
                    tipo === "copaci" &&
                    usuario === "copaci" &&
                    password === "COPACI2026"
                ) {

                    localStorage.setItem(
                        "tipoUsuario",
                        "copaci"
                    );

                    localStorage.setItem(
                        "usuarioActual",
                        "copaci"
                    );

                    window.location.href =
                        "copaci.html";

                    return;

                }


                // ====================================
                // CIUDADANO
                // ====================================

                if (tipo === "ciudadano") {

                    const ciudadanos =
                        obtenerCiudadanos();


                    const ciudadano =
                        ciudadanos.find(function(persona) {

                            if (
                                !persona ||
                                !persona.usuario ||
                                persona.password === undefined
                            ) {

                                return false;

                            }


                            return (
                                String(persona.usuario)
                                    .trim()
                                    .toLowerCase()
                                    === usuario

                                &&

                                String(persona.password)
                                    === password
                            );

                        });


                    if (ciudadano) {

                        localStorage.setItem(
                            "tipoUsuario",
                            "ciudadano"
                        );


                        localStorage.setItem(
                            "usuarioActual",
                            ciudadano.usuario
                        );


                        localStorage.setItem(
                            "ciudadanoActual",
                            JSON.stringify(ciudadano)
                        );


                        window.location.href =
                            "ciudadano.html";

                        return;

                    }


                    mensaje.textContent =
                        "❌ Usuario o contraseña incorrectos.";

                    mensaje.className =
                        "error";

                    return;

                }


                // ====================================
                // ERROR
                // ====================================

                mensaje.textContent =
                    "⚠️ Selecciona un tipo de usuario.";

                mensaje.className =
                    "error";

            });


        // ========================================
        // MOSTRAR REGISTRO
        // ========================================

        function mostrarRegistro() {

            document
                .getElementById("loginForm")
                .style.display = "none";


            document
                .getElementById("opcionRegistro")
                .style.display = "none";


            document
                .getElementById("mensaje")
                .textContent = "";


            document
                .getElementById("registro")
                .style.display = "block";

        }


        // ========================================
        // OCULTAR REGISTRO
        // ========================================

        function ocultarRegistro() {

            document
                .getElementById("registro")
                .style.display = "none";


            document
                .getElementById("loginForm")
                .style.display = "block";


            document
                .getElementById("opcionRegistro")
                .style.display = "block";


            document
                .getElementById("mensajeRegistro")
                .textContent = "";

        }


        // ========================================
        // REGISTRAR CIUDADANO
        // ========================================

        function registrarCiudadano() {

            const nombre =
                document
                    .getElementById("nombreRegistro")
                    .value
                    .trim();


            const usuario =
                document
                    .getElementById("usuarioRegistro")
                    .value
                    .trim()
                    .toLowerCase();


            const correo =
                document
                    .getElementById("correoRegistro")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("passwordRegistro")
                    .value;


            const mensaje =
                document
                    .getElementById("mensajeRegistro");


            // ====================================
            // COMPROBAR CAMPOS
            // ====================================

            if (
                nombre === "" ||
                usuario === "" ||
                correo === "" ||
                password === ""
            ) {

                mensaje.textContent =
                    "⚠️ Completa todos los campos.";

                mensaje.className =
                    "error";

                return;

            }


            // ====================================
            // COMPROBAR CONTRASEÑA
            // ====================================

            if (password.length < 4) {

                mensaje.textContent =
                    "⚠️ La contraseña debe tener al menos 4 caracteres.";

                mensaje.className =
                    "error";

                return;

            }


            // ====================================
            // OBTENER CIUDADANOS
            // ====================================

            const ciudadanos =
                obtenerCiudadanos();


            // ====================================
            // COMPROBAR USUARIO REPETIDO
            // ====================================

            const existe =
                ciudadanos.some(function(persona) {

                    if (
                        !persona ||
                        !persona.usuario
                    ) {

                        return false;

                    }


                    return (
                        String(persona.usuario)
                            .trim()
                            .toLowerCase()
                            === usuario
                    );

                });


            if (existe) {

                mensaje.textContent =
                    "⚠️ Ese usuario ya está registrado.";

                mensaje.className =
                    "error";

                return;

            }


            // ====================================
            // CREAR CIUDADANO
            // ====================================

            const nuevoCiudadano = {

                nombre: nombre,

                usuario: usuario,

                correo: correo,

                password: password

            };


            // ====================================
            // GUARDAR CIUDADANO
            // ====================================

            ciudadanos.push(
                nuevoCiudadano
            );


            try {

                localStorage.setItem(
                    "ciudadanos",
                    JSON.stringify(ciudadanos)
                );

            } catch (error) {

                mensaje.textContent =
                    "❌ No se pudo guardar la cuenta.";

                mensaje.className =
                    "error";

                return;

            }


            // ====================================
            // MENSAJE DE ÉXITO
            // ====================================

            mensaje.textContent =
                "✅ Cuenta creada correctamente.";

            mensaje.className =
                "correcto";


            // ====================================
            // LIMPIAR FORMULARIO
            // ====================================

            document
                .getElementById("nombreRegistro")
                .value = "";


            document
                .getElementById("usuarioRegistro")
                .value = "";


            document
                .getElementById("correoRegistro")
                .value = "";


            document
                .getElementById("passwordRegistro")
                .value = "";


            // ====================================
            // REGRESAR AL LOGIN
            // ====================================

            setTimeout(function() {

                ocultarRegistro();

            }, 1500);

        }

    </script>

</body>

</html>
